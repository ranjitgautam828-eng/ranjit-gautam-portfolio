  <rect x="30" y="370" width="740" height="60" rx="6" fill="#1e293b"/>
  <rect x="50" y="385" width="12" height="3" fill="#3b82f6"/><text x="68" y="392" font-family="system-ui" font-size="9" fill="#94a3b8">Core (EtherChannel + OSPF/EIGRP)</text>
