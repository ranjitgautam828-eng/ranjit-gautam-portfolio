<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560">
  <rect width="900" height="560" fill="#0f172a"/>
  <text x="450" y="30" font-family="Arial,sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="600" letter-spacing="2">SECURE CAMPUS NETWORK — 3-LAYER HIERARCHICAL DESIGN</text>

  <!-- CORE LAYER -->
  <text x="450" y="58" font-family="Arial,sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle" letter-spacing="1">CORE LAYER</text>
  <rect x="290" y="66" width="120" height="44" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="350" y="84" font-family="Arial,sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle" font-weight="600">Core-SW1</text>
  <text x="350" y="100" font-family="Arial,sans-serif" font-size="9" fill="#60a5fa" text-anchor="middle">Multilayer Switch</text>
  <rect x="490" y="66" width="120" height="44" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="550" y="84" font-family="Arial,sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle" font-weight="600">Core-SW2</text>
  <text x="550" y="100" font-family="Arial,sans-serif" font-size="9" fill="#60a5fa" text-anchor="middle">Multilayer Switch</text>
  <!-- EtherChannel between core -->
  <line x1="410" y1="88" x2="490" y2="88" stroke="#3b82f6" stroke-width="3"/>
  <text x="450" y="82" font-family="Arial,sans-serif" font-size="8" fill="#93c5fd" text-anchor="middle">EtherChannel</text>
  <text x="450" y="97" font-family="Arial,sans-serif" font-size="8" fill="#60a5fa" text-anchor="middle">OSPF/EIGRP</text>

  <!-- DISTRIBUTION LAYER -->
  <text x="450" y="142" font-family="Arial,sans-serif" font-size="10" fill="#22c55e" text-anchor="middle" letter-spacing="1">DISTRIBUTION LAYER</text>
  <!-- Dist SW1 -->
  <rect x="60" y="150" width="110" height="44" rx="6" fill="#1a3a2a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="115" y="168" font-family="Arial,sans-serif" font-size="10" fill="#86efac" text-anchor="middle" font-weight="600">Dist-SW1</text>
  <text x="115" y="184" font-family="Arial,sans-serif" font-size="9" fill="#4ade80" text-anchor="middle">Cisco 3560-24PS</text>
  <!-- Dist SW2 -->
  <rect x="230" y="150" width="110" height="44" rx="6" fill="#1a3a2a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="285" y="168" font-family="Arial,sans-serif" font-size="10" fill="#86efac" text-anchor="middle" font-weight="600">Dist-SW2</text>
  <text x="285" y="184" font-family="Arial,sans-serif" font-size="9" fill="#4ade80" text-anchor="middle">Cisco 3560-24PS</text>
  <!-- Dist SW3 -->
  <rect x="560" y="150" width="110" height="44" rx="6" fill="#1a3a2a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="615" y="168" font-family="Arial,sans-serif" font-size="10" fill="#86efac" text-anchor="middle" font-weight="600">Dist-SW3</text>
  <text x="615" y="184" font-family="Arial,sans-serif" font-size="9" fill="#4ade80" text-anchor="middle">Cisco 3560-24PS</text>
  <!-- Dist SW4 -->
  <rect x="730" y="150" width="110" height="44" rx="6" fill="#1a3a2a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="785" y="168" font-family="Arial,sans-serif" font-size="10" fill="#86efac" text-anchor="middle" font-weight="600">Dist-SW4</text>
  <text x="785" y="184" font-family="Arial,sans-serif" font-size="9" fill="#4ade80" text-anchor="middle">Cisco 3560-24PS</text>
  <!-- Core to Distribution lines -->
  <line x1="330" y1="110" x2="115" y2="150" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="340" y1="110" x2="285" y2="150" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="560" y1="110" x2="615" y2="150" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="570" y1="110" x2="785" y2="150" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- ACCESS LAYER -->
  <text x="450" y="224" font-family="Arial,sans-serif" font-size="10" fill="#a855f7" text-anchor="middle" letter-spacing="1">ACCESS LAYER — PORT SECURITY + ACLs</text>
  <!-- 8 access switches across -->
  <rect x="20" y="232" width="85" height="36" rx="4" fill="#2d1b4e" stroke="#a855f7" stroke-width="1"/>
  <text x="63" y="248" font-family="Arial,sans-serif" font-size="9" fill="#c4b5fd" text-anchor="middle" font-weight="600">Acc-SW1</text>
  <text x="63" y="260" font-family="Arial,sans-serif" font-size="8" fill="#7c3aed" text-anchor="middle">Admin VLAN3</text>
  <rect x="115" y="232" width="85" height="36" rx="4" fill="#2d1b4e" stroke="#a855f7" stroke-width="1"/>
  <text x="158" y="248" font-family="Arial,sans-serif" font-size="9" fill="#c4b5fd" text-anchor="middle" font-weight="600">Acc-SW2</text>
  <text x="158" y="260" font-family="Arial,sans-serif" font-size="8" fill="#7c3aed" text-anchor="middle">Admin VLAN5</text>
  <rect x="210" y="232" width="85" height="36" rx="4" fill="#2d1b4e" stroke="#a855f7" stroke-width="1"/>
  <text x="253" y="248" font-family="Arial,sans-serif" font-size="9" fill="#c4b5fd" text-anchor="middle" font-weight="600">Acc-SW3</text>
  <text x="253" y="260" font-family="Arial,sans-serif" font-size="8" fill="#7c3aed" text-anchor="middle">IT VLAN9</text>
  <rect x="305" y="232" width="85" height="36" rx="4" fill="#2d1b4e" stroke="#a855f7" stroke-width="1"/>
  <text x="348" y="248" font-family="Arial,sans-serif" font-size="9" fill="#c4b5fd" text-anchor="middle" font-weight="600">Acc-SW4</text>
  <text x="348" y="260" font-family="Arial,sans-serif" font-size="8" fill="#7c3aed" text-anchor="middle">IT VLAN14</text>
  <rect x="510" y="232" width="85" height="36" rx="4" fill="#2d1b4e" stroke="#a855f7" stroke-width="1"/>
  <text x="553" y="248" font-family="Arial,sans-serif" font-size="9" fill="#c4b5fd" text-anchor="middle" font-weight="600">Acc-SW5</text>
  <text x="553" y="260" font-family="Arial,sans-serif" font-size="8" fill="#7c3aed" text-anchor="middle">Lib VLAN34</text>
  <rect x="605" y="232" width="85" height="36" rx="4" fill="#2d1b4e" stroke="#a855f7" stroke-width="1"/>
  <text x="648" y="248" font-family="Arial,sans-serif" font-size="9" fill="#c4b5fd" text-anchor="middle" font-weight="600">Acc-SW6</text>
  <text x="648" y="260" font-family="Arial,sans-serif" font-size="8" fill="#7c3aed" text-anchor="middle">Lib VLAN37</text>
  <rect x="700" y="232" width="85" height="36" rx="4" fill="#2d1b4e" stroke="#a855f7" stroke-width="1"/>
  <text x="743" y="248" font-family="Arial,sans-serif" font-size="9" fill="#c4b5fd" text-anchor="middle" font-weight="600">Acc-SW7</text>
  <text x="743" y="260" font-family="Arial,sans-serif" font-size="8" fill="#7c3aed" text-anchor="middle">Class VLAN42</text>
  <rect x="795" y="232" width="85" height="36" rx="4" fill="#2d1b4e" stroke="#a855f7" stroke-width="1"/>
  <text x="838" y="248" font-family="Arial,sans-serif" font-size="9" fill="#c4b5fd" text-anchor="middle" font-weight="600">Acc-SW8</text>
  <text x="838" y="260" font-family="Arial,sans-serif" font-size="8" fill="#7c3aed" text-anchor="middle">Class VLAN46</text>
  <!-- Dist to Access lines -->
  <line x1="115" y1="194" x2="63" y2="232" stroke="#a855f7" stroke-width="1"/>
  <line x1="115" y1="194" x2="158" y2="232" stroke="#a855f7" stroke-width="1"/>
  <line x1="285" y1="194" x2="253" y2="232" stroke="#a855f7" stroke-width="1"/>
  <line x1="285" y1="194" x2="348" y2="232" stroke="#a855f7" stroke-width="1"/>
  <line x1="615" y1="194" x2="553" y2="232" stroke="#a855f7" stroke-width="1"/>
  <line x1="615" y1="194" x2="648" y2="232" stroke="#a855f7" stroke-width="1"/>
  <line x1="785" y1="194" x2="743" y2="232" stroke="#a855f7" stroke-width="1"/>
  <line x1="785" y1="194" x2="838" y2="232" stroke="#a855f7" stroke-width="1"/>

  <!-- PC endpoints -->
  <text x="43" y="294" font-family="Arial,sans-serif" font-size="8" fill="#64748b" text-anchor="middle">PC8 PC9</text>
  <text x="138" y="294" font-family="Arial,sans-serif" font-size="8" fill="#64748b" text-anchor="middle">PC0 PC1</text>
  <text x="233" y="294" font-family="Arial,sans-serif" font-size="8" fill="#64748b" text-anchor="middle">PC10 PC11</text>
  <text x="328" y="294" font-family="Arial,sans-serif" font-size="8" fill="#64748b" text-anchor="middle">PC2 PC3</text>
  <text x="533" y="294" font-family="Arial,sans-serif" font-size="8" fill="#64748b" text-anchor="middle">PC12 PC13</text>
  <text x="628" y="294" font-family="Arial,sans-serif" font-size="8" fill="#64748b" text-anchor="middle">PC4 PC5</text>
  <text x="723" y="294" font-family="Arial,sans-serif" font-size="8" fill="#64748b" text-anchor="middle">PC14 PC15</text>
  <text x="818" y="294" font-family="Arial,sans-serif" font-size="8" fill="#64748b" text-anchor="middle">PC6 PC7</text>

  <!-- Config panel -->
  <rect x="20" y="310" width="860" height="220" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="36" y="334" font-family="Courier New,monospace" font-size="10" fill="#569cd6">! Distribution Layer — VLAN + Inter-VLAN Routing Config</text>
  <text x="36" y="352" font-family="Courier New,monospace" font-size="10" fill="#9cdcfe">Switch(config)# </text><text x="151" y="352" font-family="Courier New,monospace" font-size="10" fill="#ce9178">vlan 3</text>
  <text x="36" y="368" font-family="Courier New,monospace" font-size="10" fill="#9cdcfe">Switch(config-vlan)# </text><text x="191" y="368" font-family="Courier New,monospace" font-size="10" fill="#ce9178">name Administration</text>
  <text x="36" y="384" font-family="Courier New,monospace" font-size="10" fill="#9cdcfe">Switch(config)# </text><text x="151" y="384" font-family="Courier New,monospace" font-size="10" fill="#ce9178">interface g0/1</text>
  <text x="36" y="400" font-family="Courier New,monospace" font-size="10" fill="#9cdcfe">Switch(config-if)# </text><text x="181" y="400" font-family="Courier New,monospace" font-size="10" fill="#ce9178">switchport mode access</text>
  <text x="36" y="416" font-family="Courier New,monospace" font-size="10" fill="#9cdcfe">Switch(config-if)# </text><text x="181" y="416" font-family="Courier New,monospace" font-size="10" fill="#ce9178">switchport access vlan 3</text>
  <text x="36" y="432" font-family="Courier New,monospace" font-size="10" fill="#9cdcfe">Switch(config-if)# </text><text x="181" y="432" font-family="Courier New,monospace" font-size="10" fill="#ce9178">switchport port-security maximum 1</text>
  <text x="36" y="448" font-family="Courier New,monospace" font-size="10" fill="#9cdcfe">Switch(config-if)# </text><text x="181" y="448" font-family="Courier New,monospace" font-size="10" fill="#ce9178">switchport port-security mac-address sticky</text>
  <text x="460" y="334" font-family="Courier New,monospace" font-size="10" fill="#569cd6">! HSRP Failover — Router Redundancy</text>
  <text x="460" y="352" font-family="Courier New,monospace" font-size="10" fill="#9cdcfe">Router(config-if)# </text><text x="611" y="352" font-family="Courier New,monospace" font-size="10" fill="#ce9178">standby 1 ip 192.168.3.5</text>
  <text x="460" y="368" font-family="Courier New,monospace" font-size="10" fill="#9cdcfe">Router(config-if)# </text><text x="611" y="368" font-family="Courier New,monospace" font-size="10" fill="#ce9178">standby 1 priority 110</text>
  <text x="460" y="384" font-family="Courier New,monospace" font-size="10" fill="#9cdcfe">Router(config-if)# </text><text x="611" y="384" font-family="Courier New,monospace" font-size="10" fill="#ce9178">standby 1 preempt</text>
  <text x="460" y="404" font-family="Courier New,monospace" font-size="10" fill="#569cd6">! Ping Test Results</text>
  <text x="460" y="420" font-family="Courier New,monospace" font-size="10" fill="#4ec9b0">PC8> ping 192.168.3.5</text>
  <text x="460" y="436" font-family="Courier New,monospace" font-size="10" fill="#4ec9b0">!!!!!  Success rate 100% (5/5)</text>
  <text x="460" y="452" font-family="Courier New,monospace" font-size="10" fill="#4ec9b0">PC10> ping 192.168.9.5</text>
  <text x="460" y="468" font-family="Courier New,monospace" font-size="10" fill="#4ec9b0">!!!!!  Success rate 100% (5/5)</text>
  <!-- Legend row -->
  <rect x="36" y="484" width="12" height="3" fill="#3b82f6"/>
  <text x="54" y="490" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">Core — EtherChannel + OSPF/EIGRP</text>
  <rect x="240" y="484" width="12" height="3" fill="#22c55e"/>
  <text x="258" y="490" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">Distribution — HSRP + Inter-VLAN</text>
  <rect x="460" y="484" width="12" height="3" fill="#a855f7"/>
  <text x="478" y="490" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">Access — Port Security + ACLs</text>
  <rect x="660" y="480" width="80" height="16" rx="4" fill="#166534"/>
  <text x="700" y="492" font-family="Arial,sans-serif" font-size="9" fill="#86efac" text-anchor="middle">All pings PASSED</text>
</svg>
