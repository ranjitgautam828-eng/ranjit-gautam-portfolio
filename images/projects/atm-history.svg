<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#1e1e1e"/>
  <rect x="0" y="0" width="800" height="36" rx="8" fill="#2d2d2d"/>
  <rect x="0" y="18" width="800" height="18" fill="#2d2d2d"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="64" cy="18" r="6" fill="#28c840"/>
  <text x="400" y="23" font-family="monospace" font-size="12" fill="#888" text-anchor="middle">ATM.java — Transaction History</text>
  <text x="20" y="68" font-family="Courier New,monospace" font-size="13" fill="#dcdcaa">Enter your choice: </text>
  <text x="178" y="68" font-family="Courier New,monospace" font-size="13" fill="#ce9178">3</text>
  <text x="20" y="90" font-family="Courier New,monospace" font-size="13" fill="#dcdcaa">Enter the amount to deposit: $</text>
  <text x="254" y="90" font-family="Courier New,monospace" font-size="13" fill="#ce9178">200</text>
  <text x="20" y="112" font-family="Courier New,monospace" font-size="13" fill="#4ec9b0">Deposit successful. Updated balance: $1150.0</text>
  <line x1="20" y1="126" x2="500" y2="126" stroke="#333" stroke-width="1"/>
  <text x="20" y="148" font-family="Courier New,monospace" font-size="13" fill="#dcdcaa">Enter your choice: </text>
  <text x="178" y="148" font-family="Courier New,monospace" font-size="13" fill="#ce9178">4</text>
  <text x="20" y="180" font-family="Courier New,monospace" font-size="13" fill="#9cdcfe">Transaction History:</text>
  <text x="20" y="204" font-family="Courier New,monospace" font-size="12" fill="#d4d4d4">Withdrawal of $50.0 on Mon Apr 22 15:34:14 PDT 2024</text>
  <text x="20" y="224" font-family="Courier New,monospace" font-size="12" fill="#d4d4d4">Deposit of $200.0 on Mon Apr 22 15:35:02 PDT 2024</text>
  <line x1="20" y1="238" x2="500" y2="238" stroke="#333" stroke-width="1"/>
  <text x="20" y="260" font-family="Courier New,monospace" font-size="13" fill="#dcdcaa">Enter your choice: </text>
  <text x="178" y="260" font-family="Courier New,monospace" font-size="13" fill="#ce9178">5</text>
  <text x="20" y="284" font-family="Courier New,monospace" font-size="13" fill="#4ec9b0">Thank you for using the ATM. Goodbye!</text>
  <!-- SDD excerpt box -->
  <rect x="20" y="316" width="760" height="160" rx="8" fill="#252526" stroke="#444" stroke-width="1"/>
  <text x="36" y="340" font-family="Courier New,monospace" font-size="11" fill="#569cd6">// Software Design Document — ATM Simulator (excerpt)</text>
  <text x="36" y="360" font-family="Courier New,monospace" font-size="11" fill="#6a9955">// System Architecture: 3 modules</text>
  <text x="36" y="378" font-family="Courier New,monospace" font-size="11" fill="#d4d4d4">  User Interface Module     → menu display, input handling</text>
  <text x="36" y="396" font-family="Courier New,monospace" font-size="11" fill="#d4d4d4">  Transaction Processing    → balance, withdraw, deposit</text>
  <text x="36" y="414" font-family="Courier New,monospace" font-size="11" fill="#d4d4d4">  Data Storage Module       → ArrayList transactionHistory</text>
  <text x="36" y="434" font-family="Courier New,monospace" font-size="11" fill="#6a9955">// REQ-001: User selects ATM operation — User Interface</text>
  <text x="36" y="452" font-family="Courier New,monospace" font-size="11" fill="#6a9955">// REQ-002: System checks balance — Transaction Processing</text>
  <text x="36" y="470" font-family="Courier New,monospace" font-size="11" fill="#6a9955">// REQ-003: System processes withdrawal — Transaction Processing</text>
</svg>
