<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  <rect width="900" height="560" fill="url(#bg)"/>
  <!-- Main card -->
  <rect x="20" y="20" width="860" height="520" rx="10" fill="white"/>
  <!-- Header -->
  <text x="44" y="68" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#333">Friend Management Dashboard</text>
  <!-- Session info box -->
  <rect x="560" y="44" width="200" height="34" rx="5" fill="#f8f9fa"/>
  <text x="572" y="64" font-family="Arial,sans-serif" font-size="11" fill="#555">Logged in: john@example.com</text>
  <!-- Logout button -->
  <rect x="772" y="44" width="80" height="34" rx="5" fill="#dc3545"/>
  <text x="812" y="66" font-family="Arial,sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="600">Logout</text>
  <line x1="40" y1="90" x2="860" y2="90" stroke="#f0f0f0" stroke-width="2"/>
  <!-- Form section -->
  <rect x="40" y="104" width="820" height="196" rx="8" fill="#f8f9fa"/>
  <text x="56" y="128" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#333">Add New Friend</text>
  <!-- Name field -->
  <text x="56" y="152" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#555">Name</text>
  <rect x="56" y="158" width="808" height="34" rx="5" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="68" y="179" font-family="Arial,sans-serif" font-size="12" fill="#aaa">Full name</text>
  <!-- Age + Hobbies row -->
  <text x="56" y="210" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#555">Age</text>
  <rect x="56" y="216" width="392" height="34" rx="5" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="68" y="237" font-family="Arial,sans-serif" font-size="12" fill="#aaa">e.g. 25</text>
  <text x="472" y="210" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#555">Hobbies (comma-separated)</text>
  <rect x="472" y="216" width="392" height="34" rx="5" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="484" y="237" font-family="Arial,sans-serif" font-size="12" fill="#aaa">reading, swimming, coding</text>
  <!-- Buttons -->
  <rect x="56" y="264" width="100" height="32" rx="5" fill="#667eea"/>
  <text x="106" y="284" font-family="Arial,sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="600">Add Friend</text>
  <rect x="166" y="264" width="80" height="32" rx="5" fill="#6c757d"/>
  <text x="206" y="284" font-family="Arial,sans-serif" font-size="12" fill="white" text-anchor="middle">Cancel</text>
  <!-- Friends table -->
  <text x="40" y="330" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#333">My Friends</text>
  <!-- Table header -->
  <rect x="40" y="340" width="820" height="36" rx="0" fill="#667eea"/>
  <text x="60" y="363" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="white">Name</text>
  <text x="200" y="363" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="white">Age</text>
  <text x="280" y="363" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="white">Hobbies</text>
  <text x="480" y="363" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="white">Contact Email</text>
  <text x="650" y="363" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="white">Phone</text>
  <text x="770" y="363" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="white">Actions</text>
  <!-- Row 1 -->
  <rect x="40" y="376" width="820" height="36" fill="white"/>
  <line x1="40" y1="412" x2="860" y2="412" stroke="#ddd" stroke-width="1"/>
  <text x="60" y="399" font-family="Arial,sans-serif" font-size="12" fill="#333">Alice Johnson</text>
  <text x="200" y="399" font-family="Arial,sans-serif" font-size="12" fill="#333">24</text>
  <rect x="280" y="382" width="50" height="18" rx="3" fill="#e9ecef"/>
  <text x="305" y="395" font-family="Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">reading</text>
  <rect x="336" y="382" width="56" height="18" rx="3" fill="#e9ecef"/>
  <text x="364" y="395" font-family="Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">swimming</text>
  <text x="480" y="399" font-family="Arial,sans-serif" font-size="12" fill="#333">alice@email.com</text>
  <text x="650" y="399" font-family="Arial,sans-serif" font-size="12" fill="#333">604-555-0101</text>
  <rect x="770" y="382" width="42" height="22" rx="4" fill="#28a745"/>
  <text x="791" y="397" font-family="Arial,sans-serif" font-size="10" fill="white" text-anchor="middle">Edit</text>
  <rect x="818" y="382" width="42" height="22" rx="4" fill="#dc3545"/>
  <text x="839" y="397" font-family="Arial,sans-serif" font-size="10" fill="white" text-anchor="middle">Delete</text>
  <!-- Row 2 -->
  <rect x="40" y="412" width="820" height="36" fill="#f5f5f5"/>
  <line x1="40" y1="448" x2="860" y2="448" stroke="#ddd" stroke-width="1"/>
  <text x="60" y="435" font-family="Arial,sans-serif" font-size="12" fill="#333">Bob Smith</text>
  <text x="200" y="435" font-family="Arial,sans-serif" font-size="12" fill="#333">28</text>
  <rect x="280" y="418" width="44" height="18" rx="3" fill="#e9ecef"/>
  <text x="302" y="431" font-family="Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">gaming</text>
  <rect x="330" y="418" width="40" height="18" rx="3" fill="#e9ecef"/>
  <text x="350" y="431" font-family="Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">coding</text>
  <text x="480" y="435" font-family="Arial,sans-serif" font-size="12" fill="#333">bob@email.com</text>
  <text x="650" y="435" font-family="Arial,sans-serif" font-size="12" fill="#333">604-555-0202</text>
  <rect x="770" y="418" width="42" height="22" rx="4" fill="#28a745"/>
  <text x="791" y="433" font-family="Arial,sans-serif" font-size="10" fill="white" text-anchor="middle">Edit</text>
  <rect x="818" y="418" width="42" height="22" rx="4" fill="#dc3545"/>
  <text x="839" y="433" font-family="Arial,sans-serif" font-size="10" fill="white" text-anchor="middle">Delete</text>
  <!-- Row 3 -->
  <rect x="40" y="448" width="820" height="36" fill="white"/>
  <line x1="40" y1="484" x2="860" y2="484" stroke="#ddd" stroke-width="1"/>
  <text x="60" y="471" font-family="Arial,sans-serif" font-size="12" fill="#333">Sara Lee</text>
  <text x="200" y="471" font-family="Arial,sans-serif" font-size="12" fill="#333">22</text>
  <rect x="280" y="454" width="48" height="18" rx="3" fill="#e9ecef"/>
  <text x="304" y="467" font-family="Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">cooking</text>
  <rect x="334" y="454" width="42" height="18" rx="3" fill="#e9ecef"/>
  <text x="355" y="467" font-family="Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">hiking</text>
  <text x="480" y="471" font-family="Arial,sans-serif" font-size="12" fill="#333">sara@email.com</text>
  <text x="650" y="471" font-family="Arial,sans-serif" font-size="12" fill="#333">604-555-0303</text>
  <rect x="770" y="454" width="42" height="22" rx="4" fill="#28a745"/>
  <text x="791" y="469" font-family="Arial,sans-serif" font-size="10" fill="white" text-anchor="middle">Edit</text>
  <rect x="818" y="454" width="42" height="22" rx="4" fill="#dc3545"/>
  <text x="839" y="469" font-family="Arial,sans-serif" font-size="10" fill="white" text-anchor="middle">Delete</text>
</svg>
