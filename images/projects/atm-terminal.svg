<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Terminal window -->
  <rect width="800" height="500" fill="#1e1e1e"/>
  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="36" rx="8" fill="#2d2d2d"/>
  <rect x="0" y="18" width="800" height="18" fill="#2d2d2d"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="64" cy="18" r="6" fill="#28c840"/>
  <text x="400" y="23" font-family="monospace" font-size="12" fill="#888" text-anchor="middle">ATM.java — Java Console</text>
  <!-- Terminal content -->
  <text x="20" y="68" font-family="Courier New,monospace" font-size="13" fill="#4ec9b0">Welcome to the ATM Simulator!</text>
  <text x="20" y="92" font-family="Courier New,monospace" font-size="13" fill="#dcdcaa">Enter PIN: </text>
  <text x="120" y="92" font-family="Courier New,monospace" font-size="13" fill="#ce9178">****</text>
  <text x="20" y="124" font-family="Courier New,monospace" font-size="13" fill="#9cdcfe">ATM Menu</text>
  <text x="20" y="146" font-family="Courier New,monospace" font-size="13" fill="#d4d4d4">1. Check Balance</text>
  <text x="20" y="166" font-family="Courier New,monospace" font-size="13" fill="#d4d4d4">2. Withdraw Money</text>
  <text x="20" y="186" font-family="Courier New,monospace" font-size="13" fill="#d4d4d4">3. Deposit Money</text>
  <text x="20" y="206" font-family="Courier New,monospace" font-size="13" fill="#d4d4d4">4. Transaction History</text>
  <text x="20" y="226" font-family="Courier New,monospace" font-size="13" fill="#d4d4d4">5. Exit</text>
  <text x="20" y="248" font-family="Courier New,monospace" font-size="13" fill="#dcdcaa">Enter your choice: </text>
  <text x="178" y="248" font-family="Courier New,monospace" font-size="13" fill="#ce9178">1</text>
  <text x="20" y="272" font-family="Courier New,monospace" font-size="13" fill="#4ec9b0">Your balance is: $1000.0</text>
  <line x1="20" y1="286" x2="400" y2="286" stroke="#333" stroke-width="1"/>
  <text x="20" y="308" font-family="Courier New,monospace" font-size="13" fill="#9cdcfe">ATM Menu</text>
  <text x="20" y="328" font-family="Courier New,monospace" font-size="13" fill="#d4d4d4">1. Check Balance</text>
  <text x="20" y="348" font-family="Courier New,monospace" font-size="13" fill="#d4d4d4">2. Withdraw Money</text>
  <text x="20" y="368" font-family="Courier New,monospace" font-size="13" fill="#d4d4d4">3. Deposit Money</text>
  <text x="20" y="388" font-family="Courier New,monospace" font-size="13" fill="#d4d4d4">4. Transaction History</text>
  <text x="20" y="408" font-family="Courier New,monospace" font-size="13" fill="#d4d4d4">5. Exit</text>
  <text x="20" y="430" font-family="Courier New,monospace" font-size="13" fill="#dcdcaa">Enter your choice: </text>
  <text x="178" y="430" font-family="Courier New,monospace" font-size="13" fill="#ce9178">2</text>
  <text x="20" y="452" font-family="Courier New,monospace" font-size="13" fill="#dcdcaa">Enter the amount to withdraw: $</text>
  <text x="260" y="452" font-family="Courier New,monospace" font-size="13" fill="#ce9178">50</text>
  <text x="20" y="474" font-family="Courier New,monospace" font-size="13" fill="#4ec9b0">Withdrawal successful. Remaining balance: $950.0</text>
  <text x="20" y="494" font-family="Courier New,monospace" font-size="13" fill="#569cd6">_</text>
