<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Card -->
  <rect x="200" y="60" width="400" height="370" rx="10" fill="white"/>
  <!-- Title -->
  <text x="400" y="130" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#333" text-anchor="middle">Login</text>
  <!-- Email label -->
  <text x="240" y="178" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#555">Email</text>
  <rect x="240" y="186" width="320" height="38" rx="5" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="252" y="210" font-family="Arial,sans-serif" font-size="13" fill="#aaa">john@example.com</text>
  <!-- Password label -->
  <text x="240" y="248" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#555">Password</text>
  <rect x="240" y="256" width="320" height="38" rx="5" fill="white" stroke="#667eea" stroke-width="1.5"/>
  <text x="252" y="280" font-family="Arial,sans-serif" font-size="14" fill="#333">••••••••</text>
  <!-- Login button -->
  <rect x="240" y="312" width="320" height="42" rx="5" fill="#667eea"/>
  <text x="400" y="339" font-family="Arial,sans-serif" font-size="15" fill="white" text-anchor="middle" font-weight="600">Login</text>
  <!-- Register link -->
  <text x="400" y="390" font-family="Arial,sans-serif" font-size="13" fill="#555" text-anchor="middle">Don't have an account? </text>
  <text x="510" y="390" font-family="Arial,sans-serif" font-size="13" fill="#667eea" text-anchor="middle">Register here</text>
  <!-- Browser bar -->
  <rect x="0" y="0" width="800" height="0" fill="none"/>
</svg>
